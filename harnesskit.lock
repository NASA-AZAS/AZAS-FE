  "decisions": [
    {
      "finding": "skill-creator vs harnesskit role overlap",
      "choice": "하네스 구성은 HarnessKit, skill-creator는 형식 검증만. 전역 도구를 끄지 않고 프로젝트 역할을 구분",
      "date": "2026-11-13"
    },
    {
      "finding": "자동 코드/디자인 리뷰 vs 사용자 요청",
      "choice": "사용자 지시 우선: 자동 리뷰어 0개, 최소 실행/타입 확인만",
      "date": "2026-11-13"
    },
    {
      "finding": "하네스 구성 승인 단계",
      "choice": "초기 파일 생성 전 설계 승인을 받지 않은 점을 사용자가 지적함. 이후 전체 스킬·역할 수정안을 제시하고 사용자 ㄱㄱ 승인을 받은 뒤 외부 스킬 설치/배정을 진행.",
      "date": "2026-11-13"
    },
    {
      "finding": "매 요청 새 세션·회고·윤문",
      "choice": "해커톤 속도와 토큰 절약 요청에 맞춰 강제 세션 분리·자동 회고·한국어 윤문 도구 제외",
      "date": "2026-11-13"
    },
    {
      "finding": "기본 hktokens.py Codex 미측정",
      "choice": "사용자의 정량 기록 요청과 측정 경로 확인 요청에 따라 프로젝트의 숫자 전용 Codex 수집기로 대체. 전역 킷 수정 없음",
      "date": "2026-11-13"
    },
    {
      "finding": "도구 상한/인계 비용",
      "choice": "메인 단독 기본, 보조 동시 1개·깊이 1, UI 18/단순 10/디버그 20회 권고. 하드 토큰 한도라고 주장하지 않음",
      "date": "2026-11-13"
    },
    {
      "finding": "스타 수와 모바일 적합성 기반 스킬 선정",
      "choice": "Ponytail/UI UX Pro Max/Vercel RN/Expo 공식을 사용. 스타는 개별 스킬이 아닌 저장소 전체의 선택 시점 수치. 별도 저인지도 모바일 디자인 후보는 제외.",
      "date": "2026-11-13"
    },
    {
      "finding": "Ponytail 전체 플러그인 경고",
      "choice": "코딩 SKILL.md만 점검: SAFE 0. 훅·웹훅·review/audit/debt/gain·별도 장부 설치 안 함.",
      "date": "2026-11-13"
    },
    {
      "finding": "추가 보안 경고 4개",
      "choice": "expo-overview CAUTION 25, expo-native-ui CAUTION 19, Vercel RN CAUTION 46, expo-data-fetching DO_NOT_INSTALL 85 및 일부 분석 미완료를 알림. 사용자: 설명한 경고를 감수하고 4개도 설치. 해당 지침의 예제 명령/설정 변경/외부 전송 자동 실행 없이 프론트 범위로 제한.",
      "date": "2026-11-13"
    },
    {
      "finding": "중복 트리거와 구현 지침 우선순위",
      "choice": "expo-hackathon은 순서·배정·계측, Ponytail은 코딩 원칙, UI UX Pro Max는 시각 방향, Expo는 SDK별 구현, Vercel은 관련 RN 규칙만. 사용자 조건/Expo SDK API 우선. 전체 스킬·AGENTS.md·참조를 일괄 로드하지 않음.",
      "date": "2026-11-13"
    },
    {
      "finding": "카탈로그 Ponytail vs HarnessKit 훅 충돌",
      "choice": "이번 배포는 SKILL.md만 설치해 SubagentStart/SessionStart 훅 자체가 없다. 하네스 수정은 HarnessKit, 앱 코딩 원칙만 Ponytail. 출력 형식은 프로젝트/역할 정의 우선.",
      "date": "2026-11-13"
    },
    {
      "finding": "카탈로그 Ponytail 장부·외부전송 신호",
      "choice": "플러그인 ledger/webhook 코드를 설치하지 않아 해당 기능은 없음. 측정은 기존 로컬 bench.py만 사용.",
      "date": "2026-11-13"
    },
    {
      "finding": "Context7 연결 범위",
      "choice": "프로젝트 .codex/config.toml의 공식 HTTP endpoint와 문서 조회 2개 도구만 연결. 연결 manifest SAFE 0, initialize/tools-list 성공. 원격 운영 서버 전체의 소스 감사가 아님. 현재 CLI는 프로젝트 신뢰 설정이 없어 새 신뢰된 세션에서 로드 확인 필요.",
      "date": "2026-11-13"
    },
    {
      "finding": "Headroom",
      "choice": "이미 노출된 MCP 도구를 큰 출력에 필요할 때만 재사용. 새 프록시·훅·전역 설정 변경 없음.",
      "date": "2026-11-13"
    },
    {
      "finding": "UI UX Pro Max 추가 검사 판정",
      "choice": "전체 설치 범위 검사 DO_NOT_INSTALL 100/HIGH 10/분석 일부 미완료. CSV의 금지·안티패턴 예제가 주된 지적으로 보임을 알린 뒤 사용자: 설명한 경고를 감수하고 UI UX Pro Max도 설치. React Native 로컬 디자인 검색만 사용하고 웹 코드·훅·외부 API 연동은 사용하지 않음.",
      "date": "2026-11-13"
    }
